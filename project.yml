name: Satie
options:
  bundleIdPrefix: com.strangechances
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

targets:
  AcousticCore:
    type: library.static
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/AcousticCore
        excludes:
          - Resources/Samples/**
    dependencies:
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: IOKit.framework
      - sdk: MediaPlayer.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: AcousticCore
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        ARCHS: arm64
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  Satie:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/AcousticCircuit
      - path: AppStore/Assets.xcassets
      - path: AppStore/PrivacyInfo.xcprivacy
      - path: Sources/AcousticCore/Resources/Samples
        type: folder
        buildPhase: resources
    dependencies:
      - target: AcousticCore
      - sdk: AppKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: IOKit.framework
      - sdk: MediaPlayer.framework
    info:
      path: AppStore/Info-AppStore.plist
      properties:
        CFBundleDisplayName: Satie
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Graeme Boy. All rights reserved."
    entitlements:
      path: AppStore/Satie-AppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Satie
        PRODUCT_BUNDLE_IDENTIFIER: com.strangechances.Satie
        DEVELOPMENT_TEAM: 6KM3577ETV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore/Satie-AppStore.entitlements
        MARKETING_VERSION: "3.1.0"
        CURRENT_PROJECT_VERSION: "17"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: arm64
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          MTL_OPTIMIZATION_LEVEL: default
